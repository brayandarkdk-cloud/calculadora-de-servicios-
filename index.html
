<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Transporte</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --border: #334155;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 1.4rem;
      margin: 0 0 4px 0;
      color: var(--accent);
    }
    .header p {
      font-size: 0.85rem;
      color: var(--subtext);
      margin: 0;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .card-title {
      font-weight: bold;
      font-size: 0.95rem;
      margin-bottom: 8px;
      color: #e2e8f0;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }
    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #273549;
    }
    .item:last-child {
      border-bottom: none;
    }
    .item-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .item-info input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }
    .item-label {
      font-size: 0.9rem;
    }
    .item-price {
      font-size: 0.85rem;
      font-weight: 600;
      color: #38bdf8;
    }
    .mode-toggle {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 16px;
      background: var(--card);
      padding: 6px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }
    .mode-btn {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 16px;
      background: transparent;
      color: var(--subtext);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .mode-btn.active {
      background: var(--accent);
      color: #0f172a;
    }
    .total-box {
      position: sticky;
      bottom: 16px;
      background: #0284c7;
      color: white;
      padding: 16px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .total-title {
      font-size: 0.9rem;
      opacity: 0.9;
    }
    .total-amount {
      font-size: 1.5rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Calculadora de Transporte</h1>
    <p>Selecciona tus tramos del día</p>
  </div>

  <div class="mode-toggle">
    <button class="mode-btn active" id="btn-eco" onclick="setMode('eco')">Económico</button>
